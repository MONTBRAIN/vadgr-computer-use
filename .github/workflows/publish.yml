name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Public Chrome Web Store item id (not a secret; it is in the store URL).
  CWS_ITEM_ID: bjjpaehedfnjnjmamjhppjnjnikpnfjl

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history so the ancestry guard can run

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Read version from pyproject.toml
        id: version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Package version: $v"

      - name: "Guard tag matches pyproject version"
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match pyproject version $pkg"
            exit 1
          fi

      - name: "Guard tagged commit is on master (reject off-branch tags)"
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags --depth=200 origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tagged commit $GITHUB_SHA is not an ancestor of origin/master; refusing to publish unreviewed code."
            exit 1
          fi
          echo "Tagged commit is on master."

      - name: Verify the committed Windows broker payload
        run: python scripts/check_windows_broker_bundle.py

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Build and package the extension (unpacked + store zips)
        run: |
          set -euo pipefail
          cd extension
          npm ci
          npm run build
          ext_ver=$(node -p "require('./manifest.json').version")
          pkg_ver="${{ steps.version.outputs.version }}"
          if [ "$ext_ver" != "$pkg_ver" ]; then
            echo "Extension manifest version $ext_ver does not match package version $pkg_ver"
            exit 1
          fi
          # Unpacked zip: keeps the pinned `key`, flat at zip root (Load unpacked / sideload).
          ( cd dist && zip -r -X "$GITHUB_WORKSPACE/vadgr-cua-extension-${ext_ver}.zip" . )
          # Store zip: strip the `key` (the Web Store rejects a manifest with a key field).
          python3 -c "import json; p='dist/manifest.json'; m=json.load(open(p)); m.pop('key', None); json.dump(m, open(p,'w'), indent=2)"
          ( cd dist && zip -r -X "$GITHUB_WORKSPACE/vadgr-cua-extension-${ext_ver}-store.zip" . )
          # Guardrail: the store zip must NOT contain a key field.
          if unzip -p "$GITHUB_WORKSPACE/vadgr-cua-extension-${ext_ver}-store.zip" manifest.json | grep -q '"key"'; then
            echo "Store zip still contains a key field"
            exit 1
          fi
          echo "Packaged (sha256):"
          sha256sum "$GITHUB_WORKSPACE"/vadgr-cua-extension-*.zip | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Attest the exact release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            vadgr-cua-extension-*.zip
            computer_use/browser/winbroker/vadgr-cua-browser-broker-win-x64.zip

      - name: Upload Python dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

      - name: Upload extension zips artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-zips
          path: vadgr-cua-extension-*.zip

  pypi:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: release
      url: https://pypi.org/p/vadgr-computer-use
    permissions:
      id-token: write
    steps:
      - name: Download Python dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/
          skip-existing: true

  github-release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Python dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Download extension zips artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension-zips
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            vadgr-cua-extension-*.zip

  chrome-webstore:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    # Human gate: the chrome-web-store environment requires a reviewer's approval,
    # and holds the (non-secret) WIF vars unreadable until approved.
    environment:
      name: chrome-web-store
      url: https://chromewebstore.google.com/detail/${{ env.CWS_ITEM_ID }}
    permissions:
      contents: read
      id-token: write # keyless OIDC -> Workload Identity Federation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download extension zips artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension-zips
          path: .

      - name: Authenticate to Google (keyless WIF, service-account impersonation)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload + publish to the Chrome Web Store
        env:
          CWS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          zip=$(ls vadgr-cua-extension-*-store.zip)
          echo "Publishing $zip to item ${CWS_ITEM_ID}"
          python3 extension/scripts/cws_publish.py --item "${CWS_ITEM_ID}" --zip "$zip"
