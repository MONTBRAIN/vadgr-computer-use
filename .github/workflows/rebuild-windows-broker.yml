name: rebuild-windows-broker

on:
  push:
    branches: [feature/0.7.6-browser-reliability]
    paths: [.github/workflows/rebuild-windows-broker.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: bc079f27886beb196ff4869cbaa168ad64ca9c56
      - name: Build from the verified standalone Python archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRoot = Join-Path $env:RUNNER_TEMP 'vadgr-broker-rebuild'
          New-Item -ItemType Directory -Path $buildRoot | Out-Null
          $archive = Join-Path $buildRoot 'python.tar.gz'
          Invoke-WebRequest -Uri 'https://github.com/astral-sh/python-build-standalone/releases/download/20260825/cpython-3.12.14%2B20260825-x86_64-pc-windows-msvc-install_only.tar.gz' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '15d25c455ea25d6b24d7e58eabdf744fd0db3cfb977934ae08fd2237acd8ccc1') { throw 'Python archive hash mismatch' }
          tar -xzf $archive -C $buildRoot
          if ($LASTEXITCODE -ne 0) { throw 'Python extraction failed' }
          $python = Join-Path $buildRoot 'python/python.exe'
          & $python -m pip install uv==0.12.6
          if ($LASTEXITCODE -ne 0) { throw 'uv installation failed' }
          & $python -m uv pip install --python $python pyinstaller==6.22.2
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller installation failed' }
          & $python scripts/build_windows_broker.py --source-commit bc079f27886beb196ff4869cbaa168ad64ca9c56
          if ($LASTEXITCODE -ne 0) { throw 'Broker build failed' }
          & $python scripts/check_windows_broker_bundle.py
          if ($LASTEXITCODE -ne 0) { throw 'Broker verification failed' }
          & $python scripts/smoke_windows_broker.py
          if ($LASTEXITCODE -ne 0) { throw 'Broker smoke failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-broker-bc079f2
          path: computer_use/browser/winbroker/vadgr-cua-browser-broker-win-x64.*
          if-no-files-found: error
          retention-days: 3
