name: rebuild-windows-broker

on:
  push:
    branches: [feature/0.7.6-browser-reliability]
    paths: [.github/workflows/rebuild-windows-broker.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Preserve repository bytes in the Windows checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Prove the exact source checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $head = (& git rev-parse HEAD).Trim()
          if ($head -ne $env:SOURCE_COMMIT) { throw "checked out $head instead of $env:SOURCE_COMMIT" }
          $sourceFiles = @(
            "computer_use/__init__.py",
            "computer_use/browser/bridge.py",
            "computer_use/browser/broker.py",
            "computer_use/browser/native_host.py",
            "computer_use/browser/ownership.py",
            "computer_use/browser/private_file.py",
            "computer_use/browser/protocol.py",
            "computer_use/browser/server.py",
            "computer_use/browser/windows_acl.py",
            "computer_use/browser/windows_broker_entry.py",
            "computer_use/setup/extension_setup.py"
          )
          foreach ($relative in $sourceFiles) {
            $expected = (& git rev-parse "HEAD:$relative").Trim()
            $actual = (& git hash-object --no-filters -- $relative).Trim()
            if ($actual -ne $expected) { throw "$relative differs from its Git blob" }
            Write-Output "$relative $actual"
          }
      - name: Build with only the hash-locked broker toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $pythonArchive = Join-Path $env:RUNNER_TEMP "python.tar.gz"
          $uvArchive = Join-Path $env:RUNNER_TEMP "uv.zip"
          Invoke-WebRequest -Uri "https://github.com/astral-sh/python-build-standalone/releases/download/20260825/cpython-3.12.14%2B20260825-x86_64-pc-windows-msvc-install_only.tar.gz" -OutFile $pythonArchive
          if ((Get-FileHash -Algorithm SHA256 $pythonArchive).Hash.ToLower() -ne "15d25c455ea25d6b24d7e58eabdf744fd0db3cfb977934ae08fd2237acd8ccc1") { throw "Python archive hash mismatch" }
          Invoke-WebRequest -Uri "https://github.com/astral-sh/uv/releases/download/0.12.6/uv-x86_64-pc-windows-msvc.zip" -OutFile $uvArchive
          if ((Get-FileHash -Algorithm SHA256 $uvArchive).Hash.ToLower() -ne "df7cb9f243eae1621400d4fcf5b1b3d90f20e264ece91b64deb3b0078abca6ef") { throw "uv archive hash mismatch" }
          tar -xzf $pythonArchive -C $env:RUNNER_TEMP
          Expand-Archive -Path $uvArchive -DestinationPath (Join-Path $env:RUNNER_TEMP "uv")
          $python = Join-Path $env:RUNNER_TEMP "python\python.exe"
          $uv = Join-Path $env:RUNNER_TEMP "uv\uv.exe"
          $testEnv = Join-Path $env:RUNNER_TEMP "broker-test"
          & $uv venv --python $python $testEnv
          $testPython = Join-Path $testEnv "Scripts\python.exe"
          & $uv pip install --python $testPython ".[dev]"
          & $testPython -m pytest -q computer_use/tests/test_browser_native_host.py::TestNativeHostShutdown
          $buildEnv = Join-Path $env:RUNNER_TEMP "broker-build"
          & $uv venv --python $python $buildEnv
          $buildPython = Join-Path $buildEnv "Scripts\python.exe"
          & $uv pip install --python $buildPython --require-hashes -r requirements/windows-broker-build.txt
          & $python --version
          & $uv --version
          & $buildPython -c "import importlib.metadata; print(importlib.metadata.version('pyinstaller'))"
          $output = Join-Path $env:RUNNER_TEMP "winbroker"
          & $buildPython scripts/build_windows_broker.py --source-commit $env:SOURCE_COMMIT --output $output
          Copy-Item -Force (Join-Path $output "vadgr-cua-browser-broker-win-x64.zip") computer_use/browser/winbroker/
          Copy-Item -Force (Join-Path $output "vadgr-cua-browser-broker-win-x64.manifest.json") computer_use/browser/winbroker/
          Copy-Item -Force (Join-Path $output "vadgr-cua-browser-broker-win-x64.spdx.json") computer_use/browser/winbroker/
          & $testPython scripts/check_windows_broker_bundle.py
          & $testPython scripts/smoke_windows_broker.py
      - name: Upload only the broker artifact boundary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-broker-${{ env.SOURCE_COMMIT }}
          path: |
            computer_use/browser/winbroker/vadgr-cua-browser-broker-win-x64.zip
            computer_use/browser/winbroker/vadgr-cua-browser-broker-win-x64.manifest.json
            computer_use/browser/winbroker/vadgr-cua-browser-broker-win-x64.spdx.json
          if-no-files-found: error
