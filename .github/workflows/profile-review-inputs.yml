name: profile-review-inputs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/profile-review-inputs.yml
      - scripts/build_profile_review_inputs.py
      - scripts/tests/test_profile_review_inputs.py
      - packaging/profiles/**

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest scripts/tests/test_profile_review_inputs.py scripts/tests/test_profile_source_boundary.py -q

  preflight:
    needs: contracts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python scripts/build_profile_review_inputs.py --preflight
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          source_commit=$(python packaging/profiles/producer.py source-input)
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

  review:
    needs: preflight
    name: review-inputs-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: windows-2025
          - architecture: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.0"
      - name: Build unsigned native review inputs
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: |
          python packaging/profiles/producer.py check-source --source source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/profiles/producer.py provision-python --architecture "${{ matrix.architecture }}" --output build/review/python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/review/python/python/python.exe -I -m pip install --only-binary=:all: --require-hashes --no-deps -r requirements/windows-broker-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/review/python/python/python.exe -I scripts/build_windows_broker.py --source-repository source --source-commit "$env:SOURCE_COMMIT" --architecture "${{ matrix.architecture }}" --output build/review/native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export only unapproved text inventories and notices
        run: python scripts/build_profile_review_inputs.py --architecture "${{ matrix.architecture }}" --inputs build/review/native --output build/review/output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-inputs-${{ matrix.architecture }}
          path: build/review/output/
          if-no-files-found: error
          retention-days: 90
