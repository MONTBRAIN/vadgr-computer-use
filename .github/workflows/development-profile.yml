name: development-profile

on:
  push:
    branches: [feature/0.7.9-profile-packaging]
  pull_request:
    paths:
      - computer_use/**
      - packaging/profiles/**
      - requirements/windows-broker-build.txt
      - scripts/*profile*.py
      - scripts/build_windows_broker.py
      - .github/workflows/development-profile.yml

permissions:
  contents: read

jobs:
  unsigned-development:
    name: unsigned-development-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: windows-2025
          - architecture: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24.0"
      - name: Build the unsigned development closure
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python packaging/profiles/producer.py provision-python --architecture "${{ matrix.architecture }}" --output build/development/python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/development/python/python/python.exe -m pip install --only-binary=:all: --require-hashes --no-deps -r requirements/windows-broker-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/development/python/python/python.exe scripts/build_windows_broker.py --source-commit "$env:SOURCE_COMMIT" --architecture "${{ matrix.architecture }}" --output build/development/native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/profiles/producer.py native-smoke --inputs build/development/native --output build/development/smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_development_profile.py --helpers build/development/native --architecture "${{ matrix.architecture }}" --source-commit "$env:SOURCE_COMMIT" --output build/development/output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-development-${{ matrix.architecture }}
          path: |
            build/development/output/
            build/development/native/test.log
          if-no-files-found: error
          retention-days: 30
