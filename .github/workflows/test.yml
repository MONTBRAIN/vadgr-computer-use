name: test

on:
  push:
    branches-ignore:
      - "gh-readonly-queue/**"
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-windows-broker:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Preserve repository bytes in the Windows checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Prove the exact source checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $head = (& git rev-parse HEAD).Trim()
          if ($head -ne $env:SOURCE_COMMIT) { throw "checked out $head instead of $env:SOURCE_COMMIT" }
          $sourceFiles = @(
            "computer_use/__init__.py",
            "computer_use/browser/bridge.py",
            "computer_use/browser/broker.py",
            "computer_use/browser/native_host.py",
            "computer_use/browser/ownership.py",
            "computer_use/browser/private_file.py",
            "computer_use/browser/protocol.py",
            "computer_use/browser/server.py",
            "computer_use/browser/windows_acl.py",
            "computer_use/browser/windows_broker_entry.py",
            "computer_use/setup/extension_setup.py"
          )
          foreach ($relative in $sourceFiles) {
            $expected = (& git rev-parse "HEAD:$relative").Trim()
            $actual = (& git hash-object --no-filters -- $relative).Trim()
            if ($actual -ne $expected) { throw "$relative differs from its Git blob" }
            Write-Output "$relative $actual"
          }
      - name: Install the pinned Windows build toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $pythonArchive = Join-Path $env:RUNNER_TEMP "python.tar.gz"
          $uvArchive = Join-Path $env:RUNNER_TEMP "uv.zip"
          Invoke-WebRequest -Uri "https://github.com/astral-sh/python-build-standalone/releases/download/20260825/cpython-3.12.14%2B20260825-x86_64-pc-windows-msvc-install_only.tar.gz" -OutFile $pythonArchive
          if ((Get-FileHash -Algorithm SHA256 $pythonArchive).Hash.ToLower() -ne "15d25c455ea25d6b24d7e58eabdf744fd0db3cfb977934ae08fd2237acd8ccc1") {
            throw "python-build-standalone archive hash mismatch"
          }
          Invoke-WebRequest -Uri "https://github.com/astral-sh/uv/releases/download/0.12.6/uv-x86_64-pc-windows-msvc.zip" -OutFile $uvArchive
          if ((Get-FileHash -Algorithm SHA256 $uvArchive).Hash.ToLower() -ne "df7cb9f243eae1621400d4fcf5b1b3d90f20e264ece91b64deb3b0078abca6ef") {
            throw "uv archive hash mismatch"
          }
          tar -xzf $pythonArchive -C $env:RUNNER_TEMP
          Expand-Archive -Path $uvArchive -DestinationPath (Join-Path $env:RUNNER_TEMP "uv")
          $python = Join-Path $env:RUNNER_TEMP "python\python.exe"
          $uv = Join-Path $env:RUNNER_TEMP "uv\uv.exe"
          $buildEnv = Join-Path $env:RUNNER_TEMP "broker-build"
          & $uv venv --python $python $buildEnv
          if ($LASTEXITCODE -ne 0) { throw "uv venv failed with exit code $LASTEXITCODE" }
          $buildPython = Join-Path $buildEnv "Scripts\python.exe"
          & $uv pip install --python $buildPython ".[dev]" "pyinstaller==6.22.2"
          if ($LASTEXITCODE -ne 0) { throw "uv pip install failed with exit code $LASTEXITCODE" }
          & $python --version
          if ($LASTEXITCODE -ne 0) { throw "pinned Python failed with exit code $LASTEXITCODE" }
          & $uv --version
          if ($LASTEXITCODE -ne 0) { throw "pinned uv failed with exit code $LASTEXITCODE" }
          & $buildPython -c "import importlib.metadata; print(importlib.metadata.version('pyinstaller'))"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller version check failed with exit code $LASTEXITCODE" }
      - name: Prove relay shutdown and build the broker
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $python = Join-Path $env:RUNNER_TEMP "broker-build\Scripts\python.exe"
          & $python -m pytest -q computer_use/tests/test_browser_native_host.py::TestNativeHostShutdown
          if ($LASTEXITCODE -ne 0) { throw "relay shutdown tests failed with exit code $LASTEXITCODE" }
          $output = Join-Path $env:RUNNER_TEMP "winbroker"
          & $python scripts/build_windows_broker.py --source-commit $env:SOURCE_COMMIT --output $output
          if ($LASTEXITCODE -ne 0) { throw "broker build failed with exit code $LASTEXITCODE" }
          Copy-Item -Force (Join-Path $output "vadgr-cua-browser-broker-win-x64.zip") computer_use/browser/winbroker/
          Copy-Item -Force (Join-Path $output "vadgr-cua-browser-broker-win-x64.manifest.json") computer_use/browser/winbroker/
          Copy-Item -Force (Join-Path $output "vadgr-cua-browser-broker-win-x64.spdx.json") computer_use/browser/winbroker/
          & $python scripts/check_windows_broker_bundle.py
          if ($LASTEXITCODE -ne 0) { throw "broker bundle check failed with exit code $LASTEXITCODE" }
          & $python scripts/smoke_windows_broker.py
          if ($LASTEXITCODE -ne 0) { throw "broker smoke failed with exit code $LASTEXITCODE" }
      - name: Upload only the broker artifact boundary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-broker-${{ env.SOURCE_COMMIT }}
          path: |
            computer_use/browser/winbroker/vadgr-cua-browser-broker-win-x64.zip
            computer_use/browser/winbroker/vadgr-cua-browser-broker-win-x64.manifest.json
            computer_use/browser/winbroker/vadgr-cua-browser-broker-win-x64.spdx.json
          if-no-files-found: error

  extension:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm test
      # esbuild is pinned to the patched 0.25.0 compiler to preserve bundle bytes.
      # The test runner and DOM emulator are not shipped in the extension.
      - run: npm run build

  scientific-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned scientific test dependencies
        run: python -m pip install ".[dev]"
      - name: Test typing profile derivation
        run: python -m pytest scripts/scientific_tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.0 # pinned so lint enforcement can't drift red
      - name: Ruff check
        run: ruff check computer_use
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.0"
          cache-dependency-path: computer_use/browser/winhost/go.mod
      - name: Verify the static Windows proxy and committed broker bundle
        run: |
          set -euo pipefail
          python scripts/check_windows_broker_bundle.py
          cd computer_use/browser/winhost
          go test ./...
          GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath \
            -ldflags='-s -w -buildid=' -o "$RUNNER_TEMP/vadgr-cua-host.exe" .
          cmp "$RUNNER_TEMP/vadgr-cua-host.exe" vadgr-cua-host.exe

  windows-broker-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify and run the self-contained broker without system Python
        run: |
          python scripts/check_windows_broker_bundle.py
          python scripts/smoke_windows_broker.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        # A slow Ubuntu mirror used to end the job here rather than in a test.
        # Retries and --no-install-recommends fixed the common case, and the
        # Acquire timeouts fixed dead mirrors, but a job still burned its whole
        # step limit on one transfer from archive.ubuntu.com. The step limit is
        # now only a backstop; the loop below bounds each attempt itself.
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # apt's Acquire Timeout is an idle timeout: it restarts every time any
          # byte arrives, and apt has no minimum-rate abort (Dl-Limit is a cap,
          # not a floor). A transfer that trickles therefore never trips it, and
          # apt prints nothing until a file completes, which is exactly the
          # ten silent minutes the failing jobs showed after a Get line. The
          # Acquire options still make dead mirrors fail in seconds, but the
          # only reliable bound on a stalled transfer is external: coreutils
          # timeout kills the attempt so the retry gets a fresh connection
          # instead of waiting on a dying one. IPv4 is forced because the
          # connect-level stall is the long-known IPv6 route to that host.
          APT_OPTS="-o Acquire::Retries=3 \
                    -o Acquire::http::Timeout=15 \
                    -o Acquire::https::Timeout=15 \
                    -o Acquire::ForceIPv4=true"
          for attempt in 1 2 3; do
            # A partial update is survivable: the runner image ships with usable
            # package lists, so install is what decides the step.
            sudo timeout -k 5 45 apt-get $APT_OPTS update \
              || echo "update attempt $attempt was partial"
            # These five packages fetch a few MB without recommends; a healthy
            # mirror finishes in well under a minute, so 120s only ever cuts a
            # stall short.
            if sudo timeout -k 5 120 apt-get $APT_OPTS install -y --no-install-recommends \
                 xvfb xdotool scrot python3-gi gir1.2-atspi-2.0; then
              exit 0
            fi
            echo "apt attempt $attempt failed or stalled, retrying"
            # A kill that lands after unpack started leaves dpkg mid
            # transaction, which would fail the next attempt for a reason that
            # is not the network.
            sudo timeout -k 5 30 dpkg --configure -a || true
            sleep 5
          done
          echo "apt failed three times; the archive is unreachable, not the code" >&2
          exit 1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest computer_use/tests -q

  clean-install:
    # A first-time user's install, proven on every platform this runtime claims.
    # This is the gate the 0.6.6 break slipped through: a fresh install of 0.6.5
    # could not start vadgr-cua at all, because a dependency floor let a
    # breaking major through and nothing checked a clean install before publish.
    #
    # A clean machine is a normal user's machine: the operating system and its
    # libraries, with no build tooling, no dev extras and no source tree in
    # reach. It ran only on Linux, which said nothing about the other three
    # platforms the README claims, and a sibling repository was caught by
    # exactly that.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the shipped wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: The version this run built, read from the manifest
        shell: bash
        run: |
          set -euo pipefail
          # From the wheel's own name, so it is the artifact under test that
          # names the version. Reading pyproject needs tomllib, which is only in
          # the standard library from 3.11, and this matrix includes 3.10.
          wheel="$(ls dist/*.whl)"
          version="$(basename "$wheel" | cut -d- -f2)"
          test -n "$version"
          echo "CLEAN_INSTALL_EXPECT_VERSION=$version" >> "$GITHUB_ENV"
          echo "the wheel under test is $version"

      # Linux has containers, so the machine is made rather than approximated:
      # a python image with the wheel and nothing else, and a neutral working
      # directory so the source tree cannot shadow the install.
      - name: Install only the wheel on a machine with nothing else, and use it
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/w" \
            -e CLEAN_INSTALL_EXPECT_VERSION="$CLEAN_INSTALL_EXPECT_VERSION" \
            -e CLEAN_INSTALL_REQUIRE_CONSOLE_SCRIPT=1 \
            "python:${{ matrix.python-version }}-slim" bash -c '
              set -euo pipefail
              pip install --quiet /w/dist/*.whl
              cd /tmp
              python /w/scripts/clean_install_smoke.py
            '

      # Windows and macOS have no container to escape the runner, so the machine
      # is APPROXIMATED: a fresh virtual environment carrying the wheel and its
      # declared dependencies, entered from a neutral directory. The runner's own
      # tooling still exists on disk, so a green run here is a weaker claim than
      # the Linux leg's, and it is the strongest available on these platforms.
      - name: Install only the wheel in a fresh environment, and use it
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/clean"
          if [ -d "$RUNNER_TEMP/clean/Scripts" ]; then
            bin="$RUNNER_TEMP/clean/Scripts"
          else
            bin="$RUNNER_TEMP/clean/bin"
          fi
          "$bin/python" -m pip install --quiet --upgrade pip
          "$bin/python" -m pip install --quiet dist/*.whl
          # The console script must exist here: this is a real wheel install.
          export CLEAN_INSTALL_REQUIRE_CONSOLE_SCRIPT=1
          export PATH="$bin:$PATH"
          smoke="$PWD/scripts/clean_install_smoke.py"
          cd "$RUNNER_TEMP"
          "$bin/python" "$smoke"
