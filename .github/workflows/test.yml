name: test

on:
  push:
    branches-ignore:
      - "gh-readonly-queue/**"
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.0 # pinned so lint enforcement can't drift red
      - name: Ruff check
        run: ruff check computer_use

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        # A slow Ubuntu mirror used to end the job here rather than in a test.
        # The step had one attempt inside five minutes, and a single 11 MB font
        # package pulled in as a recommend was enough to spend all of it, so a
        # green suite and an unreachable archive looked the same. Retried, and
        # asked for the five packages without their recommends, which are
        # ghostscript and SVG loaders that nothing in this suite renders.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # apt has no connection timeout by default, so one unreachable mirror
          # stalls the whole step instead of failing over. The runner's sources
          # list a fast regional mirror and archive.ubuntu.com, and it was the
          # second one hanging: every other line came back in milliseconds while
          # its InRelease fetch sat for fourteen minutes. These bound the wait so
          # a dead mirror costs seconds and the retry can actually help. IPv4 is
          # forced because the stall is the long-known IPv6 route to that host.
          APT_OPTS="-o Acquire::Retries=3 \
                    -o Acquire::http::Timeout=15 \
                    -o Acquire::https::Timeout=15 \
                    -o Acquire::ForceIPv4=true"
          for attempt in 1 2 3; do
            # A partial update is survivable: the packages below live on the
            # regional mirror, so install is what decides the step.
            sudo apt-get $APT_OPTS update || echo "update attempt $attempt was partial"
            if sudo apt-get $APT_OPTS install -y --no-install-recommends \
                 xvfb xdotool scrot python3-gi gir1.2-atspi-2.0; then
              exit 0
            fi
            echo "apt attempt $attempt failed, retrying"
            sleep 10
          done
          echo "apt failed three times; the archive is unreachable, not the code" >&2
          exit 1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest computer_use/tests -q

  clean-install:
    # A first-time user's install, proven on a from-nothing machine on every PR.
    # This is the gate the 0.6.6 break slipped through: a fresh install of 0.6.5
    # could not start vadgr-cua at all, because a dependency floor let a breaking
    # major through and nothing checked a clean install before publish. The wheel
    # is built on the runner, then installed ALONE in a minimal container that
    # carries no build tooling, no dev extras and no apt packages, so an
    # undeclared dependency or a broken entry point fails here, not at a user's
    # first run.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the shipped wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install ONLY the wheel in a from-nothing container and smoke it
        run: |
          docker run --rm -v "$PWD:/w" "python:${{ matrix.python-version }}-slim" bash -c '
            set -e
            pip install --quiet /w/dist/*.whl
            cd /tmp                         # a neutral cwd so the source tree cannot shadow the install
            python /w/scripts/clean_install_smoke.py
          '
